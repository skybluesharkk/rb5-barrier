# 바리어 실험 기본 설정. 명령행 인자가 이 값을 덮어쓴다.
robot_ip: 192.168.50.50      # 왼팔 .50 / 오른팔 .51 (Wi-Fi, dt-recon과 동일)
host: 0.0.0.0                # ZMQ bind 주소. Quest APK는 이 PC의 IP(ip -br -4 addr)로 접속하게 설정
hz: 50                       # 제어 루프 주기
speed_bar: 0.3
scale: 1.0                   # 손 이동량 → 로봇 이동량 배율 (손 10 cm = 로봇 10 cm)
v_max: 0.25                  # 로봇 손끝 최대 속도 (m/s). 손이 이보다 빨라도 여기서 잘린다 (안전)
servo:
  t1: 0.03                   # move_servo_l look-ahead (s). 1/hz 보다 조금 크게
  t2: 0.10                   # 컨트롤러 스무딩 (s). 작을수록 바리어 효과가 그대로 보임. 워치독도 겸함
  gain: 1.0
  alpha: 1.0

# 실험 박스 (m, 로봇 base 기준 TCP). 시작 시 TCP가 이 안에 있어야 한다.
# 2026-10-23: base 원점을 x·y 정중앙으로 두고 Jane WORKSPACE 크기의 1.5배 (x 0.675, z 0.75).
# 2026-10-27: x ±0.75 (앞뒤), y ±0.55 (좌우) 로. 주의: RB5-850E 도달 반경 ≈ 0.9 m 라 수평 거리 0.75 이상은 z 가 낮은 곳에서만 닿는다 → 먼 모서리는 바리어보다 팔 길이가 먼저 막는다.
# z 는 아래를 0.20 으로 고정하고 위로 늘렸다 (base 판·책상 높이 z=0, 아래로 내리면 책상에 닿음).
# 주의: 박스 가운데(수평 반경 < 0.25 m)는 base 기둥 특이점 영역이라 실제로는 갈 수 없다 — Jane 은 R_MIN_XY=0.25 로 막았음.
box:
  xmin: -0.75
  xmax: 0.75
  ymin: -0.55
  ymax: 0.55
  zmin: 0.20
  zmax: 0.95

# 안전 박스 (항상 hard). 실험 박스 + 각 면 0.10 m (z 아래는 0.05).
safety_box:
  xmin: -0.85
  xmax: 0.85
  ymin: -0.65
  ymax: 0.65
  zmin: 0.15
  zmax: 1.05

r_min: 0.15                  # base 기둥 원기둥 반지름 (m). rb5-teleop 의 r_inner 와 같은 값 (2026-10-23 0.25 → 0.15)

barrier:
  mode: hard                 # none | hard | cbf
  alpha: 5.0                 # cbf 일 때만. 벽에서 v/alpha 거리부터 감속 (0.25 m/s, α=5 → 5 cm 전부터)

# 손 좌표계 (Quest → 로봇). Quest 추적 원점의 yaw 는 앱 시작·리센터 때마다 달라져서 "앞"이 로봇 어느 축인지 매번 다르다.
# 그래서 추적 시작 직후 사용자가 손을 로봇 쪽(앞)으로 calib_dist 만큼 뻗으면 그 방향을 user_forward 에 맞춰 yaw 를 자동 보정한다.
hand_frame:
  user_forward: [1, 0, 0]    # 사용자가 바라보는 방향 (로봇 base 좌표, 수평). 2026-10-23 로그: 손 "앞" → 로봇 +x·+y 사이, 사용자는 "왼쪽"이라 함 → +x 를 보고 서 있음
  calib_dist: 0              # m. 0 = 자동 보정 끄고 yaw_deg 만 사용 (0.15 로 두면 추적 시작 후 손을 앞으로 뻗어 자동 보정)
  yaw_deg: -42               # 고정 yaw (deg, 로봇 z 축). 2026-10-23 실기 로그에서 측정. 앱 재시작·리센터 후 틀어지면 다시 맞출 것

# 손 추적 끊김 처리 (2026-10-27: 전부 끔. "없다고 생각하고" 시야에서 사라졌다 돌아올 때 어떻게 되는지 실기로 보고 새 해결책을 넣기로 함)
quest:
  jump_guard_m: 0            # servo_teleop 의 점프가드: 손목이 이 거리(m) 이상 점프하면 1 s 거부 후 새 좌표계로 수용. 0 = 끔 (모든 패킷 그대로 사용)
  ignore_zero: true          # Quest 가 손을 못 볼 때 보내는 (0,0,0) 을 손 위치로 쓰지 않고 마지막 값 유지. false = 그대로 사용 (z=-0.86 m 목표 → 바닥 벽까지 내려감)
  stall_restart: false       # 컨트롤러가 명령을 못 따라올 때 현재 로봇 자세로 자동 재시작. false = 경고만 찍고 그대로 둠
  timeout_restart: false     # servo_teleop 의 QUEST_TIMEOUT: 패킷이 0.5 s 끊기면 추적 중단, 재개 시 그 순간 위치로 재기준. false = 경고만, 마지막 목표 유지·재개 시 그대로 이어감
